name: Update contribution activity

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_activity.py'
      - '.github/workflows/contribution-activity.yml'

permissions:
  contents: write

concurrency:
  group: contribution-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Generate the contribution chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_activity.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution activity"
          git push origin HEAD:main
